<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفتر الحسابات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f3f5f4;--card:#fff;--ink:#17211f;--mute:#667370;--line:#dfe5e3;--in:#0f7b5f;--out:#b3382c;--accent:#17211f;}
  @media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1a2321;--ink:#e8efed;--mute:#93a39f;--line:#2b3835;--in:#3fcf9f;--out:#ff8b7d;--accent:#e8efed;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 100px}
  h1{font-size:1.3rem;margin:0}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:10px 16px;background:var(--accent);color:var(--bg)}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid .full{grid-column:1/-1}
  .totals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .totals div{text-align:center}
  .totals b{display:block;font-size:1.25rem;direction:ltr}
  .in{color:var(--in)} .out{color:var(--out)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row small{color:var(--mute);display:block}
  .amt{font-weight:600;direction:ltr;white-space:nowrap}
  .del{background:transparent;color:var(--mute);padding:4px 8px;border:1px solid var(--line)}
  .bar{display:flex;gap:8px;align-items:end;margin-bottom:12px}
  .bar>div{flex:1}
  #msg{min-height:1.4em;font-size:.9rem;color:var(--out);margin-top:8px}
  .empty{color:var(--mute);text-align:center;padding:20px 0}
  .hero{text-align:center;padding:4px 0 14px}
  .hero span{color:var(--mute);font-size:.85rem}
  .hero b{display:block;font-size:2.2rem;font-weight:600;direction:ltr;line-height:1.25}
  .sub{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:12px}
  .sub div{text-align:center}
  .sub span{color:var(--mute);font-size:.85rem}
  .sub b{display:block;direction:ltr;font-size:1.05rem}
  .row{border-inline-start:3px solid var(--line);padding-inline-start:10px}
  .row.income{border-inline-start-color:var(--in)}
  .row.expense{border-inline-start-color:var(--out)}
  .ptitle{font-size:1rem;margin:0 0 12px}
  .cat{margin-bottom:12px}
  .cat:last-child{margin-bottom:0}
  .cat .top{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;margin-bottom:4px}
  .cat .top span:last-child{direction:ltr;color:var(--mute);white-space:nowrap}
  .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .fill{height:100%;background:var(--out);border-radius:4px}
  .fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;width:52px;height:52px;border-radius:50%;padding:0;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.28);z-index:20}
  .calc{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;width:280px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:20;direction:ltr}
  .calc .screen{text-align:right;padding:4px 4px 10px;word-break:break-all}
  .calc .expr{color:var(--mute);font-size:.9rem;min-height:1.4em}
  .calc .res{font-size:1.6rem;font-weight:600;min-height:2.2rem}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .keys button{padding:12px 0;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:1.05rem}
  .keys button.op,.keys button.fn{color:var(--in)}
  .keys button.eq{background:var(--accent);color:var(--bg)}
  .keys .span2{grid-column:span 2}
  .calc .use{width:100%;margin-top:8px;font-size:.9rem}
  .hidden{display:none}
  @media (max-width:520px){.grid{grid-template-columns:1fr}.totals b{font-size:1rem}}
</style>
</head>
<body>
<div class="wrap">

  <!-- شاشة الدخول -->
  <section id="loginView" class="hidden">
    <header><h1>دفتر الحسابات</h1></header>
    <div class="panel">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="username" dir="ltr">
      <div style="height:12px"></div>
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" dir="ltr">
      <div style="height:16px"></div>
      <button id="loginBtn">تسجيل الدخول</button>
      <div id="msg" role="alert"></div>
    </div>
  </section>

  <!-- التطبيق -->
  <section id="appView" class="hidden">
    <header>
      <div><h1 style="display:inline">دفتر الحسابات</h1> <small id="roleBadge" style="color:var(--mute)"></small></div>
      <div style="display:flex;gap:8px"><button class="ghost" id="pwBtn">كلمة المرور</button><button class="ghost" id="logoutBtn">تسجيل الخروج</button></div>
    </header>

    <div class="panel hidden" id="pwPanel">
      <div class="grid">
        <div><label for="pw1">كلمة المرور الجديدة (10 أحرف على الأقل)</label><input id="pw1" type="password" autocomplete="new-password" dir="ltr"></div>
        <div><label for="pw2">تأكيد كلمة المرور</label><input id="pw2" type="password" autocomplete="new-password" dir="ltr"></div>
        <div class="full"><button id="pwSave">حفظ كلمة المرور</button></div>
      </div>
      <div id="pwMsg" role="alert" style="min-height:1.4em;font-size:.9rem;margin-top:8px"></div>
    </div>

    <div class="panel">
      <div class="bar">
        <div><label for="month">الشهر</label><input id="month" type="month"></div>
        <button class="ghost" id="allBtn">كل الفترات</button>
        <button class="ghost" id="csvBtn">تصدير CSV</button>
      </div>
      <div class="hero"><span>الرصيد</span><b id="tBal">0</b></div>
      <div class="sub">
        <div><span>الوارد</span><b class="in" id="tIn">0</b></div>
        <div><span>المصروف</span><b class="out" id="tOut">0</b></div>
      </div>
    </div>

    <div class="panel" id="formPanel">
      <div class="grid">
        <div><label for="kind">النوع</label>
          <select id="kind"><option value="expense">مصروف</option><option value="income">وارد</option></select></div>
        <div><label for="amount">المبلغ</label><input id="amount" type="number" min="0" step="0.01" inputmode="decimal" dir="ltr"></div>
        <div><label for="category">الفئة</label><input id="category" list="cats" placeholder="مثال: طعام، فواتير، راتب">
          <datalist id="cats"></datalist></div>
        <div><label for="date">التاريخ</label><input id="date" type="date" dir="ltr"></div>
        <div class="full"><label for="note">ملاحظة (اختياري)</label><input id="note"></div>
        <div class="full" style="display:flex;gap:8px"><button id="addBtn">إضافة العملية</button><button class="ghost hidden" id="cancelEditBtn">إلغاء التعديل</button></div>
      </div>
      <div id="appMsg" role="alert" style="min-height:1.4em;font-size:.9rem;color:var(--out);margin-top:8px"></div>
    </div>

    <div class="panel">
      <h2 class="ptitle">المصروفات حسب الفئة</h2>
      <div id="chart"></div>
    </div>

    <div class="panel" id="list"></div>

    <button class="fab" id="calcFab" aria-label="الحاسبة">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>
    </button>
    <div class="calc hidden" id="calcPanel" role="dialog" aria-label="الحاسبة">
      <div class="screen"><div class="expr" id="calcExpr"></div><div class="res" id="calcRes">0</div></div>
      <div class="keys" id="calcKeys"></div>
      <button class="use hidden" id="calcUse">نقل الناتج إلى خانة المبلغ</button>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== الإعدادات: استبدل القيمتين من لوحة Supabase (Project Settings > API) ===== */
const SUPABASE_URL = "https://fpxthuiyshmmnrfjhqcc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable___otMdd1kfWmnlhwqomAbA_lKwE2gtc";
const CURRENCY = ""; // مثال: "ر.س" أو "$" أو اتركها فارغة
/* مهم: لا تضع هنا مفتاح service_role أبداً */

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let rows = [];
let myRole = null;
let editingId = null;

const fmt = n => Number(n).toLocaleString("en-US", {maximumFractionDigits: 2}) + (CURRENCY ? " " + CURRENCY : "");
const today = () => new Date().toISOString().slice(0, 10);

/* ---------- الدخول والخروج ---------- */
async function refreshSession() {
  const { data: { session } } = await db.auth.getSession();
  $("loginView").classList.toggle("hidden", !!session);
  $("appView").classList.toggle("hidden", !session);
  if (session) {
    $("date").value = today();
    $("month").value = today().slice(0, 7);
    await loadRole();
    $("formPanel").classList.toggle("hidden", myRole === "viewer");
    if (!myRole) {
      rows = []; render();
      $("addBtn").disabled = true;
      $("appMsg").textContent = "هذا الحساب لا يملك صلاحية الوصول. تواصل مع مالك الموقع.";
      return;
    }
    $("addBtn").disabled = false;
    await load();
  }
}

async function loadRole() {
  const { data, error } = await db.rpc("my_role");
  myRole = error ? null : data;
  $("roleBadge").textContent = myRole === "owner" ? "(المالك)" : myRole === "viewer" ? "(القراءة فقط)" : "";
}

$("loginBtn").onclick = async () => {
  $("msg").textContent = "";
  const { error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });
  if (error) { $("msg").textContent = "فشل الدخول: تأكد من البريد وكلمة المرور."; return; }
  $("password").value = "";
  refreshSession();
};

$("logoutBtn").onclick = async () => { await db.auth.signOut(); rows = []; myRole = null; refreshSession(); };

/* ---------- البيانات ---------- */
async function load() {
  const { data, error } = await db.from("transactions")
    .select("*").order("tx_date", { ascending: false }).order("created_at", { ascending: false });
  if (error) { $("appMsg").textContent = "تعذّر جلب البيانات: " + error.message; return; }
  rows = data;
  $("cats").replaceChildren(...[...new Set(rows.map(r => r.category))].map(c => {
    const o = document.createElement("option"); o.value = c; return o;
  }));
  render();
}

function visibleRows() {
  const m = $("month").value;
  return m ? rows.filter(r => r.tx_date.startsWith(m)) : rows;
}

function render() {
  const vis = visibleRows();
  const tin = vis.filter(r => r.kind === "income").reduce((s, r) => s + Number(r.amount), 0);
  const tout = vis.filter(r => r.kind === "expense").reduce((s, r) => s + Number(r.amount), 0);
  $("tIn").textContent = fmt(tin);
  $("tOut").textContent = fmt(tout);
  $("tBal").textContent = fmt(tin - tout);
  $("tBal").className = (tin - tout) < 0 ? "out" : "";
  renderChart(vis);

  const list = $("list");
  list.replaceChildren();
  if (!vis.length) {
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = "لا توجد عمليات في هذه الفترة. أضف أول عملية من النموذج أعلاه.";
    list.append(e); return;
  }
  vis.forEach(r => {
    const row = document.createElement("div"); row.className = "row " + r.kind;
    const left = document.createElement("div");
    const t = document.createElement("div"); t.textContent = r.category;
    const s = document.createElement("small"); s.textContent = r.tx_date + (r.note ? " — " + r.note : "");
    left.append(t, s);
    const a = document.createElement("div");
    a.className = "amt " + (r.kind === "income" ? "in" : "out");
    a.textContent = (r.kind === "income" ? "+" : "−") + fmt(r.amount);
    const d = document.createElement("button");
    d.className = "del"; d.textContent = "حذف"; d.onclick = () => remove(r.id);
    const ed = document.createElement("button");
    ed.className = "del"; ed.textContent = "تعديل"; ed.onclick = () => startEdit(r);
    const acts = document.createElement("div"); acts.style.cssText = "display:flex;gap:6px";
    acts.append(ed, d);
    if (myRole === "owner") row.append(left, a, acts); else row.append(left, a);
    list.append(row);
  });
}

function renderChart(vis) {
  const box = $("chart");
  box.replaceChildren();
  const sums = {};
  vis.filter(r => r.kind === "expense").forEach(r => {
    sums[r.category] = (sums[r.category] || 0) + Number(r.amount);
  });
  const entries = Object.entries(sums).sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((s, e) => s + e[1], 0);
  if (!entries.length) {
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = "لا توجد مصروفات في هذه الفترة.";
    box.append(e); return;
  }
  entries.forEach(([name, val]) => {
    const pct = val / total * 100;
    const wrap = document.createElement("div"); wrap.className = "cat";
    const top = document.createElement("div"); top.className = "top";
    const n = document.createElement("span"); n.textContent = name;
    const v = document.createElement("span"); v.textContent = fmt(val) + " · " + pct.toFixed(0) + "%";
    top.append(n, v);
    const track = document.createElement("div"); track.className = "track";
    const fill = document.createElement("div"); fill.className = "fill"; fill.style.width = pct + "%";
    track.append(fill);
    wrap.append(top, track);
    box.append(wrap);
  });
}

$("addBtn").onclick = async () => {
  $("appMsg").textContent = "";
  const amount = parseFloat($("amount").value);
  const category = $("category").value.trim();
  if (!(amount > 0) || !category || !$("date").value) {
    $("appMsg").textContent = "أدخل مبلغاً أكبر من صفر وفئة وتاريخاً."; return;
  }
  const payload = {
    kind: $("kind").value, amount, category,
    note: $("note").value.trim() || null, tx_date: $("date").value
  };
  if (editingId) {
    const { data, error } = await db.from("transactions").update(payload).eq("id", editingId).select();
    if (error) { $("appMsg").textContent = "تعذّر الحفظ: " + error.message; return; }
    if (!data || !data.length) { $("appMsg").textContent = "لا تملك صلاحية التعديل."; return; }
    stopEdit();
  } else {
    const { error } = await db.from("transactions").insert(payload);
    if (error) { $("appMsg").textContent = "تعذّر الحفظ: " + error.message; return; }
    $("amount").value = ""; $("note").value = "";
  }
  load();
};

function startEdit(r) {
  editingId = r.id;
  $("kind").value = r.kind; $("amount").value = r.amount; $("category").value = r.category;
  $("date").value = r.tx_date; $("note").value = r.note || "";
  $("addBtn").textContent = "حفظ التعديل";
  $("cancelEditBtn").classList.remove("hidden");
  $("appMsg").textContent = "";
  $("amount").focus();
}

function stopEdit() {
  editingId = null;
  $("amount").value = ""; $("note").value = ""; $("category").value = "";
  $("date").value = today();
  $("addBtn").textContent = "إضافة العملية";
  $("cancelEditBtn").classList.add("hidden");
}
$("cancelEditBtn").onclick = stopEdit;

async function remove(id) {
  if (!confirm("حذف هذه العملية نهائياً؟")) return;
  const { data, error } = await db.from("transactions").delete().eq("id", id).select();
  if (error) { $("appMsg").textContent = "تعذّر الحذف: " + error.message; return; }
  if (!data || !data.length) { $("appMsg").textContent = "لا تملك صلاحية الحذف."; return; }
  load();
}

$("pwBtn").onclick = () => { $("pwPanel").classList.toggle("hidden"); $("pwMsg").textContent = ""; };
$("pwSave").onclick = async () => {
  const p1 = $("pw1").value, p2 = $("pw2").value, m = $("pwMsg");
  m.style.color = "var(--out)";
  if (p1.length < 10) { m.textContent = "كلمة المرور يجب ألا تقل عن 10 أحرف."; return; }
  if (p1 !== p2) { m.textContent = "كلمتا المرور غير متطابقتين."; return; }
  const { error } = await db.auth.updateUser({ password: p1 });
  if (error) { m.textContent = "تعذّر التغيير: " + error.message; return; }
  $("pw1").value = ""; $("pw2").value = "";
  m.style.color = "var(--in)"; m.textContent = "تم تغيير كلمة المرور.";
};

$("month").onchange = render;
$("allBtn").onclick = () => { $("month").value = ""; render(); };

/* ---------- تصدير CSV (نسخة احتياطية على جهازك) ---------- */
$("csvBtn").onclick = () => {
  const esc = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = [["date", "kind", "amount", "category", "note"].join(",")]
    .concat(visibleRows().map(r => [r.tx_date, r.kind, r.amount, r.category, r.note].map(esc).join(",")));
  const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "transactions.csv"; a.click();
  URL.revokeObjectURL(a.href);
};

/* ---------- الحاسبة ---------- */
let calcExpr = "";
const calcKeys = [
  ["C","C","fn"],["⌫","B","fn"],["÷","÷","op"],["×","×","op"],
  ["7","7",""],["8","8",""],["9","9",""],["−","-","op"],
  ["4","4",""],["5","5",""],["6","6",""],["+","+","op"],
  ["1","1",""],["2","2",""],["3","3",""],["=","=","eq"],
  ["0","0","span2"],["00","00",""],[".",".",""]
];

function calcEval(str) {
  const t = str.match(/\d*\.?\d+|[+\-×÷]/g) || [];
  let i = 0;
  const num = () => {
    let sign = 1;
    while (t[i] === "-" || t[i] === "+") { if (t[i] === "-") sign = -sign; i++; }
    const v = parseFloat(t[i++]);
    if (isNaN(v)) throw new Error("bad");
    return sign * v;
  };
  const term = () => {
    let v = num();
    while (t[i] === "×" || t[i] === "÷") { const op = t[i++]; const r = num(); v = op === "×" ? v * r : v / r; }
    return v;
  };
  let v = term();
  while (i < t.length && (t[i] === "+" || t[i] === "-")) { const op = t[i++]; const r = term(); v = op === "+" ? v + r : v - r; }
  if (i < t.length || !isFinite(v)) throw new Error("bad");
  return Math.round(v * 1e8) / 1e8;
}

function calcShow() {
  $("calcExpr").textContent = calcExpr.replace(/-/g, "−");
  let r = "0";
  try { if (calcExpr) r = String(calcEval(calcExpr)); } catch (e) { r = ""; }
  $("calcRes").textContent = r;
}

function calcPress(v) {
  if (v === "C") calcExpr = "";
  else if (v === "B") calcExpr = calcExpr.slice(0, -1);
  else if (v === "=") { try { calcExpr = String(calcEval(calcExpr)); } catch (e) {} }
  else if ("+-×÷".includes(v)) {
    if (!calcExpr && v !== "-") return;
    if (/[+\-×÷]$/.test(calcExpr)) calcExpr = calcExpr.slice(0, -1) + v; else calcExpr += v;
  } else calcExpr += v;
  calcShow();
}

calcKeys.forEach(([label, val, cls]) => {
  const b = document.createElement("button");
  b.textContent = label; b.className = cls; b.onclick = () => calcPress(val);
  $("calcKeys").append(b);
});

$("calcFab").onclick = () => {
  $("calcPanel").classList.toggle("hidden");
  $("calcUse").classList.toggle("hidden", $("formPanel").classList.contains("hidden"));
};

$("calcUse").onclick = () => {
  try {
    const r = calcEval(calcExpr || "0");
    if (!(r > 0)) { $("calcRes").textContent = "المبلغ يجب أن يكون أكبر من صفر"; return; }
    $("amount").value = String(Math.round(r * 100) / 100);
    $("calcPanel").classList.add("hidden");
    $("amount").focus();
  } catch (e) { $("calcRes").textContent = "عملية غير صحيحة"; }
};
