<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفتر الحسابات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f3f5f4;--card:#fff;--ink:#17211f;--mute:#667370;--line:#dfe5e3;--in:#0f7b5f;--out:#b3382c;--warn:#b7791f;--accent:#17211f;}
  @media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1a2321;--ink:#e8efed;--mute:#93a39f;--line:#2b3835;--in:#3fcf9f;--out:#ff8b7d;--warn:#f0b455;--accent:#e8efed;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 100px}
  h1{font-size:1.3rem;margin:0}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:10px 16px;background:var(--accent);color:var(--bg)}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid .full{grid-column:1/-1}
  .totals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .totals div{text-align:center}
  .totals b{display:block;font-size:1.25rem;direction:ltr}
  .in{color:var(--in)} .out{color:var(--out)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row small{color:var(--mute);display:block}
  .amt{font-weight:600;direction:ltr;white-space:nowrap}
  .del{background:transparent;color:var(--mute);padding:4px 8px;border:1px solid var(--line)}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:12px}
  .bar>div{flex:1 1 220px}
  #msg{min-height:1.4em;font-size:.9rem;color:var(--out);margin-top:8px}
  .empty{color:var(--mute);text-align:center;padding:20px 0}
  .hero{text-align:center;padding:4px 0 14px}
  .hero span{color:var(--mute);font-size:.85rem}
  .hero b{display:block;font-size:2.2rem;font-weight:600;direction:ltr;line-height:1.25}
  .sub{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:12px}
  .sub div{text-align:center}
  .sub span{color:var(--mute);font-size:.85rem}
  .sub b{display:block;direction:ltr;font-size:1.05rem}
  .row{border-inline-start:3px solid var(--line);padding-inline-start:10px}
  .row.income{border-inline-start-color:var(--in)}
  .row.expense{border-inline-start-color:var(--out)}
  .ptitle{font-size:1rem;margin:0 0 12px}
  .cat{margin-bottom:12px}
  .cat:last-child{margin-bottom:0}
  .cat .top{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;margin-bottom:4px}
  .cat .top span:last-child{direction:ltr;color:var(--mute);white-space:nowrap}
  .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .fill{height:100%;background:var(--out);border-radius:4px}
  .fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;width:52px;height:52px;border-radius:50%;padding:0;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.28);z-index:20}
  .calc{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;width:280px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:20;direction:ltr}
  .calc .screen{text-align:right;padding:4px 4px 10px;word-break:break-all}
  .calc .expr{color:var(--mute);font-size:.9rem;min-height:1.4em}
  .calc .res{font-size:1.6rem;font-weight:600;min-height:2.2rem}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .keys button{padding:12px 0;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:1.05rem}
  .keys button.op,.keys button.fn{color:var(--in)}
  .keys button.eq{background:var(--accent);color:var(--bg)}
  .keys .span2{grid-column:span 2}
  .calc .use{width:100%;margin-top:8px;font-size:.9rem}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:30;display:grid;place-items:center;padding:16px}
  .mbox{max-width:100%;max-height:100%;display:flex;flex-direction:column;gap:10px;align-items:center}
  .mbox img{max-width:100%;max-height:80vh;border-radius:8px;background:#fff}
  .mbox button{background:var(--card);color:var(--ink)}
  .ledgerBar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .ledgerBar select{flex:1;font-weight:600}
  .ledgerBar button{padding:10px 14px;white-space:nowrap}
  .hidden{display:none}
  @media (max-width:520px){.grid{grid-template-columns:1fr}.totals b{font-size:1rem}}
</style>
</head>
<body>
<div class="wrap">

  <!-- شاشة الدخول -->
  <section id="loginView" class="hidden">
    <header><h1>دفتر الحسابات</h1></header>
    <div class="panel">
      <label for="email">اسم المستخدم أو البريد الإلكتروني</label>
      <input id="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr">
      <div style="height:12px"></div>
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" dir="ltr">
      <div style="height:16px"></div>
      <button id="loginBtn">تسجيل الدخول</button>
      <div id="msg" role="alert"></div>
    </div>
  </section>

  <!-- التطبيق -->
  <section id="appView" class="hidden">
    <header>
      <div><h1 style="display:inline">دفتر الحسابات</h1> <small id="roleBadge" style="color:var(--mute)"></small></div>
      <div style="display:flex;gap:8px"><button class="ghost" id="pwBtn">كلمة المرور</button><button class="ghost" id="logoutBtn">تسجيل الخروج</button></div>
    </header>

    <div class="panel hidden" id="pwPanel">
      <div class="grid">
        <div><label for="pw1">كلمة المرور الجديدة (10 أحرف على الأقل)</label><input id="pw1" type="password" autocomplete="new-password" dir="ltr"></div>
        <div><label for="pw2">تأكيد كلمة المرور</label><input id="pw2" type="password" autocomplete="new-password" dir="ltr"></div>
        <div class="full"><button id="pwSave">حفظ كلمة المرور</button></div>
      </div>
      <div id="pwMsg" role="alert" style="min-height:1.4em;font-size:.9rem;margin-top:8px"></div>
    </div>

    <div class="panel">
      <div class="bar">
        <div><label for="month">الشهر</label>
          <div style="display:flex;gap:6px">
            <button class="ghost" id="prevMonth" aria-label="الشهر السابق" style="padding:10px 14px">›</button>
            <input id="month" type="month">
            <button class="ghost" id="nextMonth" aria-label="الشهر التالي" style="padding:10px 14px">‹</button>
          </div></div>
        <button class="ghost" id="allBtn">كل الفترات</button>
        <button class="ghost" id="csvBtn">تصدير CSV</button>
        <button class="ghost hidden" id="importBtn">استيراد CSV</button>
        <input id="importFile" type="file" accept=".csv,text/csv" class="hidden">
      </div>
      <div class="ledgerBar">
        <select id="ledgerSelect" aria-label="الدفتر الحالي"></select>
        <button class="ghost hidden" id="ledgerAddBtn">+ دفتر جديد</button>
        <button class="ghost hidden" id="ledgerDelBtn" style="color:var(--out)">حذف الدفتر</button>
      </div>
      <div id="impMsg" role="status" style="font-size:.9rem;margin-bottom:10px"></div>
      <div class="hero"><span>الرصيد</span><b id="tBal">0</b></div>
      <div class="sub">
        <div><span>الوارد</span><b class="in" id="tIn">0</b></div>
        <div><span>المصروف</span><b class="out" id="tOut">0</b></div>
      </div>
    </div>

    <div class="panel" id="formPanel">
      <div class="grid">
        <div><label for="kind">النوع</label>
          <select id="kind"><option value="expense">مصروف</option><option value="income">وارد</option></select></div>
        <div><label for="amount">المبلغ</label><input id="amount" type="number" min="0" step="0.01" inputmode="decimal" dir="ltr"></div>
        <div><label for="category">الفئة</label><input id="category" list="cats" placeholder="مثال: طعام، فواتير، راتب">
          <datalist id="cats"></datalist></div>
        <div><label for="date">التاريخ</label><input id="date" type="date" dir="ltr"></div>
        <div class="full"><label for="note">ملاحظة (اختياري)</label><input id="note"></div>
        <div class="full"><label for="receipt">صورة الفاتورة (اختياري)</label>
          <input id="receipt" type="file" accept="image/*">
          <small id="receiptInfo" style="color:var(--mute)"></small></div>
        <div class="full" style="display:flex;gap:8px"><button id="addBtn">إضافة العملية</button><button class="ghost hidden" id="cancelEditBtn">إلغاء التعديل</button></div>
      </div>
      <div id="appMsg" role="alert" style="min-height:1.4em;font-size:.9rem;color:var(--out);margin-top:8px"></div>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 class="ptitle" style="margin:0">المصروفات حسب الفئة</h2>
        <button class="ghost hidden" id="budgetToggle" style="padding:6px 12px">الميزانيات</button>
      </div>
      <small id="chartHint" style="color:var(--mute);display:block;margin-bottom:10px"></small>
      <div id="budgetPanel" class="hidden" style="border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px">
        <div class="grid">
          <div><label for="bCat">الفئة</label><input id="bCat" list="cats"></div>
          <div><label for="bLimit">الحد الشهري</label><input id="bLimit" type="number" min="0" step="0.01" inputmode="decimal" dir="ltr"></div>
          <div class="full"><button id="bSave">حفظ الميزانية</button></div>
        </div>
        <div id="bMsg" role="alert" style="min-height:1.4em;font-size:.9rem;color:var(--out);margin-top:6px"></div>
        <div id="bList"></div>
      </div>
      <div id="chart"></div>
    </div>

    <div class="panel" id="list"></div>

    <button class="fab" id="calcFab" aria-label="الحاسبة">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>
    </button>
    <div class="modal hidden" id="rcModal">
      <div class="mbox"><button class="ghost" id="rcClose">إغلاق</button><img id="rcImg" alt="صورة الفاتورة"></div>
    </div>
    <div class="calc hidden" id="calcPanel" role="dialog" aria-label="الحاسبة">
      <div class="screen"><div class="expr" id="calcExpr"></div><div class="res" id="calcRes">0</div></div>
      <div class="keys" id="calcKeys"></div>
      <button class="use hidden" id="calcUse">نقل الناتج إلى خانة المبلغ</button>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== الإعدادات: استبدل القيمتين من لوحة Supabase (Project Settings > API) ===== */
const SUPABASE_URL = "https://fpxthuiyshmmnrfjhqcc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable___otMdd1kfWmnlhwqomAbA_lKwE2gtc";
const USERNAME_DOMAIN = "example.com"; // نطاق وهمي محجوز للتجارب، لا تغيّره بعد إنشاء الحسابات
const CURRENCY = ""; // مثال: "ر.س" أو "$" أو اتركها فارغة
/* مهم: لا تضع هنا مفتاح service_role أبداً */

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let rows = [];
let myRole = null;
let editingId = null;
let budgets = {};
let ledgers = [];
let currentLedgerId = null;

const fmt = n => Number(n).toLocaleString("en-US", {maximumFractionDigits: 2}) + (CURRENCY ? " " + CURRENCY : "");
const today = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};

/* ---------- الدخول والخروج ---------- */
async function refreshSession() {
  const { data: { session } } = await db.auth.getSession();
  $("loginView").classList.toggle("hidden", !!session);
  $("appView").classList.toggle("hidden", !session);
  if (session) {
    $("date").value = today();
    $("month").value = today().slice(0, 7);
    await loadRole();
    $("formPanel").classList.toggle("hidden", myRole === "viewer");
    $("budgetToggle").classList.toggle("hidden", myRole !== "owner");
    $("pwBtn").classList.toggle("hidden", myRole !== "owner");
    if (myRole !== "owner") $("pwPanel").classList.add("hidden");
    $("importBtn").classList.toggle("hidden", myRole !== "owner");
    $("ledgerAddBtn").classList.toggle("hidden", myRole !== "owner");
    $("ledgerDelBtn").classList.toggle("hidden", myRole !== "owner");
    if (!myRole) {
      rows = []; render();
      $("addBtn").disabled = true;
      $("appMsg").textContent = "هذا الحساب لا يملك صلاحية الوصول. تواصل مع مالك الموقع.";
      return;
    }
    $("addBtn").disabled = false;
    await loadLedgers();
    await load();
  }
}

async function loadRole() {
  const { data, error } = await db.rpc("my_role");
  myRole = error ? null : data;
  $("roleBadge").textContent = myRole === "owner" ? "(المالك)" : myRole === "viewer" ? "(القراءة فقط)" : "";
}

function toLoginEmail(raw) {
  const v = raw.trim();
  if (!v) return { error: "اكتب اسم المستخدم أو البريد الإلكتروني." };
  if (v.includes("@")) return { email: v };
  if (!/^[A-Za-z0-9._-]{3,32}$/.test(v)) {
    return { error: "اسم المستخدم: أحرف إنجليزية وأرقام و . _ - فقط (من 3 إلى 32)." };
  }
  return { email: v.toLowerCase() + "@" + USERNAME_DOMAIN };
}

$("loginBtn").onclick = async () => {
  $("msg").textContent = "";
  const login = toLoginEmail($("email").value);
  if (login.error) { $("msg").textContent = login.error; return; }
  const { error } = await db.auth.signInWithPassword({
    email: login.email,
    password: $("password").value
  });
  if (error) { $("msg").textContent = "فشل الدخول: تأكد من اسم المستخدم أو البريد وكلمة المرور."; return; }
  $("password").value = "";
  refreshSession();
};

$("logoutBtn").onclick = async () => { await db.auth.signOut(); rows = []; myRole = null; refreshSession(); };

/* ---------- البيانات ---------- */
function rememberLedger(id) {
  try { localStorage.setItem("financeLastLedgerId", id); } catch (e) {}
}
function recallLedger() {
  try { return localStorage.getItem("financeLastLedgerId"); } catch (e) { return null; }
}

async function loadLedgers() {
  const { data, error } = await db.from("ledgers").select("*").order("created_at", { ascending: true });
  ledgers = (!error && data) ? data : [];
  if (!ledgers.length) { $("ledgerSelect").replaceChildren(); return; }
  if (!currentLedgerId || !ledgers.some(l => l.id === currentLedgerId)) {
    const saved = recallLedger();
    currentLedgerId = (saved && ledgers.some(l => l.id === saved)) ? saved : ledgers[0].id;
  }
  rememberLedger(currentLedgerId);
  $("ledgerSelect").replaceChildren(...ledgers.map(l => {
    const o = document.createElement("option"); o.value = l.id; o.textContent = l.name;
    if (l.id === currentLedgerId) o.selected = true;
    return o;
  }));
}

$("ledgerSelect").onchange = async () => {
  currentLedgerId = $("ledgerSelect").value;
  rememberLedger(currentLedgerId);
  await loadBudgets();
  await load();
};

$("ledgerAddBtn").onclick = async () => {
  const raw = prompt("اسم الدفتر الجديد:");
  if (!raw || !raw.trim()) return;
  const name = raw.trim();
  const dup = ledgers.some(l => l.name.trim().toLowerCase() === name.toLowerCase());
  if (dup) { alert('يوجد دفتر بهذا الاسم بالفعل: "' + name + '". اختر اسماً مختلفاً.'); return; }
  const { data, error } = await db.from("ledgers").insert({ name, viewer_visible: false }).select().single();
  if (error) {
    const msg = /duplicate|unique/i.test(error.message) ? 'يوجد دفتر بهذا الاسم بالفعل.' : ('تعذّر إنشاء الدفتر: ' + error.message);
    alert(msg); return;
  }
  currentLedgerId = data.id;
  rememberLedger(currentLedgerId);
  await loadLedgers();
  await loadBudgets();
  await load();
};

$("ledgerDelBtn").onclick = async () => {
  if (ledgers.length <= 1) { alert("لا يمكن حذف الدفتر الوحيد المتبقي."); return; }
  const cur = ledgers.find(l => l.id === currentLedgerId);
  if (!cur) return;

  const { data: txs, error: e1 } = await db.from("transactions")
    .select("id, receipt_path").eq("ledger_id", currentLedgerId);
  if (e1) { alert("تعذّر التحقق من محتوى الدفتر: " + e1.message); return; }

  let msg = 'سيُحذف دفتر "' + cur.name + '" نهائياً مع ' + txs.length + ' عملية، ولا يمكن التراجع عن هذا.';
  if (cur.viewer_visible) msg += '\n\nتنبيه: هذا هو الدفتر الذي يراه حساب القراءة (ahmed)، وسيفقد الوصول إليه بعد الحذف.';
  if (!confirm(msg)) return;
  if (prompt('للتأكيد النهائي، اكتب اسم الدفتر بالضبط: "' + cur.name + '"') !== cur.name) {
    alert("تم الإلغاء، الاسم غير مطابق."); return;
  }

  $("ledgerDelBtn").disabled = true;
  try {
    const paths = txs.map(t => t.receipt_path).filter(Boolean);
    if (paths.length) await db.storage.from("receipts").remove(paths);

    const { error: e2 } = await db.from("budgets").delete().eq("ledger_id", currentLedgerId);
    if (e2) throw e2;
    const { error: e3 } = await db.from("transactions").delete().eq("ledger_id", currentLedgerId);
    if (e3) throw e3;
    const { error: e4 } = await db.from("ledgers").delete().eq("id", currentLedgerId);
    if (e4) throw e4;

    currentLedgerId = null;
    await loadLedgers();
    await loadBudgets();
    await load();
  } catch (e) {
    alert("تعذّر إتمام الحذف: " + (e.message || e));
  } finally {
    $("ledgerDelBtn").disabled = false;
  }
};

async function fetchAll() {
  const PAGE = 1000, MAX_PAGES = 100;
  const all = [];
  for (let page = 0; page < MAX_PAGES; page++) {
    const from = page * PAGE;
    const { data, error } = await db.from("transactions").select("*")
      .order("tx_date", { ascending: false })
      .order("created_at", { ascending: false })
      .order("id", { ascending: true })
      .eq("ledger_id", currentLedgerId)
      .range(from, from + PAGE - 1);
    if (error) return { error };
    if (!data.length) break;
    all.push(...data);
  }
  return { data: all };
}

async function load() {
  const { data, error } = await fetchAll();
  if (error) { $("appMsg").textContent = "تعذّر جلب البيانات: " + error.message; return; }
  rows = data;
  $("cats").replaceChildren(...[...new Set(rows.map(r => r.category))].map(c => {
    const o = document.createElement("option"); o.value = c; return o;
  }));
  await loadBudgets();
  render();
}

function visibleRows() {
  const m = $("month").value;
  return m ? rows.filter(r => r.tx_date.startsWith(m)) : rows;
}

function render() {
  const vis = visibleRows();
  const tin = vis.filter(r => r.kind === "income").reduce((s, r) => s + Number(r.amount), 0);
  const tout = vis.filter(r => r.kind === "expense").reduce((s, r) => s + Number(r.amount), 0);
  $("tIn").textContent = fmt(tin);
  $("tOut").textContent = fmt(tout);
  $("tBal").textContent = fmt(tin - tout);
  $("tBal").className = (tin - tout) < 0 ? "out" : "";
  renderChart(vis);

  const list = $("list");
  list.replaceChildren();
  if (!vis.length) {
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = "لا توجد عمليات في هذه الفترة. أضف أول عملية من النموذج أعلاه.";
    list.append(e); return;
  }
  vis.forEach(r => {
    const row = document.createElement("div"); row.className = "row " + r.kind;
    const left = document.createElement("div");
    const t = document.createElement("div"); t.textContent = r.category;
    const s = document.createElement("small"); s.textContent = r.tx_date + (r.note ? " — " + r.note : "");
    left.append(t, s);
    const a = document.createElement("div");
    a.className = "amt " + (r.kind === "income" ? "in" : "out");
    a.textContent = (r.kind === "income" ? "+" : "−") + fmt(r.amount);
    const d = document.createElement("button");
    d.className = "del"; d.textContent = "حذف"; d.onclick = () => remove(r.id);
    const ed = document.createElement("button");
    ed.className = "del"; ed.textContent = "تعديل"; ed.onclick = () => startEdit(r);
    const acts = document.createElement("div"); acts.style.cssText = "display:flex;gap:6px";
    if (r.receipt_path) {
      const rc = document.createElement("button");
      rc.className = "del"; rc.textContent = "فاتورة"; rc.onclick = () => showReceipt(r.receipt_path);
      acts.append(rc);
    }
    if (myRole === "owner") acts.append(ed, d);
    row.append(left, a, acts);
    list.append(row);
  });
}

function renderChart(vis) {
  const box = $("chart");
  box.replaceChildren();
  const month = $("month").value;
  const hasBudgets = month && Object.keys(budgets).length > 0;
  $("chartHint").textContent = hasBudgets
    ? "الفئات التي لها ميزانية يقيس شريطها الصرف من الحد الشهري، وغيرها يقيس حصتها من إجمالي المصروفات."
    : "";
  const sums = {};
  vis.filter(r => r.kind === "expense").forEach(r => {
    sums[r.category] = (sums[r.category] || 0) + Number(r.amount);
  });
  if (month) Object.keys(budgets).forEach(c => { if (!(c in sums)) sums[c] = 0; });
  const entries = Object.entries(sums).sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((s, e) => s + e[1], 0);
  if (!entries.length) {
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = "لا توجد مصروفات في هذه الفترة.";
    box.append(e); return;
  }
  entries.forEach(([name, val]) => {
    const limit = month ? budgets[name] : undefined;
    const wrap = document.createElement("div"); wrap.className = "cat";
    const top = document.createElement("div"); top.className = "top";
    const n = document.createElement("span"); n.textContent = name;
    const v = document.createElement("span");
    const track = document.createElement("div"); track.className = "track";
    const fill = document.createElement("div"); fill.className = "fill";
    let note = null;
    if (limit) {
      const ratio = val / limit;
      fill.style.width = Math.min(100, ratio * 100) + "%";
      fill.style.background = ratio > 1 ? "var(--out)" : ratio >= 0.8 ? "var(--warn)" : "var(--in)";
      v.textContent = fmt(val) + " من " + fmt(limit) + " · " + Math.round(ratio * 100) + "%";
      if (ratio > 1) {
        note = document.createElement("small");
        note.style.color = "var(--out)";
        note.textContent = "تجاوزت الحد بمقدار " + fmt(val - limit);
      }
    } else {
      const pct = val / total * 100;
      fill.style.width = pct + "%";
      v.textContent = fmt(val) + " · " + pct.toFixed(0) + "%";
    }
    top.append(n, v);
    track.append(fill);
    wrap.append(top, track);
    if (note) wrap.append(note);
    box.append(wrap);
  });
}

async function loadBudgets() {
  const { data, error } = await db.from("budgets").select("*").eq("ledger_id", currentLedgerId);
  budgets = {};
  if (!error && data) data.forEach(x => { budgets[x.category] = Number(x.monthly_limit); });
  renderBudgetList();
}

async function deleteBudget(c) {

const MAX_DIM = 1600;

async function compressImage(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch (e) { bmp = await createImageBitmap(file); }
  const scale = Math.min(1, MAX_DIM / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(bmp, 0, 0, w, h);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("فشل ضغط الصورة")), "image/jpeg", 0.8));
}

async function uploadReceipt(file) {
  const blob = await compressImage(file);
  const { data: { session } } = await db.auth.getSession();
  const path = session.user.id + "/" + crypto.randomUUID() + ".jpg";
  const { error } = await db.storage.from("receipts").upload(path, blob, { contentType: "image/jpeg" });
  if (error) throw error;
  return path;
}

    note: $("note").value.trim() || null, tx_date: $("date").value,

  };

function shiftMonth(delta) {
  const v = $("month").value || today().slice(0, 7);
  let [y, m] = v.split("-").map(Number);
  m += delta;
  while (m < 1) { m += 12; y--; }
  while (m > 12) { m -= 12; y++; }
  $("month").value = y + "-" + String(m).padStart(2, "0");
  render();
}
$("prevMonth").onclick = () => shiftMonth(-1);
$("nextMonth").onclick = () => shiftMonth(1);

/* ---------- الحاسبة ---------- */
let calcExpr = "";
const calcKeys = [
  ["C","C","fn"],["⌫","B","fn"],["÷","÷","op"],["×","×","op"],
  ["7","7",""],["8","8",""],["9","9",""],["−","-","op"],
  ["4","4",""],["5","5",""],["6","6",""],["+","+","op"],
  ["1","1",""],["2","2",""],["3","3",""],["=","=","eq"],
  ["0","0","span2"],["00","00",""],[".",".",""]
];

function calcEval(str) {
  const t = str.match(/\d*\.?\d+|[+\-×÷]/g) || [];
  let i = 0;
  const num = () => {
    let sign = 1;
    while (t[i] === "-" || t[i] === "+") { if (t[i] === "-") sign = -sign; i++; }
    const v = parseFloat(t[i++]);
    if (isNaN(v)) throw new Error("bad");
    return sign * v;
  };
  const term = () => {
    let v = num();
    while (t[i] === "×" || t[i] === "÷") { const op = t[i++]; const r = num(); v = op === "×" ? v * r : v / r; }
    return v;
  };
  let v = term();
  while (i < t.length && (t[i] === "+" || t[i] === "-")) { const op = t[i++]; const r = term(); v = op === "+" ? v + r : v - r; }
  if (i < t.length || !isFinite(v)) throw new Error("bad");
  return Math.round(v * 1e8) / 1e8;
}

function calcShow() {
  $("calcExpr").textContent = calcExpr.replace(/-/g, "−");
  let r = "0";
  try { if (calcExpr) r = String(calcEval(calcExpr)); } catch (e) { r = ""; }
  $("calcRes").textContent = r;
}

function calcPress(v) {
  if (v === "C") calcExpr = "";
  else if (v === "B") calcExpr = calcExpr.slice(0, -1);
  else if (v === "=") { try { calcExpr = String(calcEval(calcExpr)); } catch (e) {} }
  else if ("+-×÷".includes(v)) {
    if (!calcExpr && v !== "-") return;
    if (/[+\-×÷]$/.test(calcExpr)) calcExpr = calcExpr.slice(0, -1) + v; else calcExpr += v;
  } else calcExpr += v;
  calcShow();
}

};

/* ---------- استيراد CSV ---------- */
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const out = [];
  let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); out.push(row); row = []; cur = "";
    } else cur += ch;
  }
  if (cur !== "" || row.length) { row.push(cur); out.push(row); }
  return out.filter(r => r.some(c => c.trim() !== ""));
}

const rowKey = r => JSON.stringify([r.tx_date, r.kind, Number(r.amount).toFixed(2), r.category, r.note || ""]);

$("importBtn").onclick = () => $("importFile").click();

$("importFile").onchange = async () => {
  const f = $("importFile").files[0];
  $("importFile").value = "";
  if (!f) return;
  const msg = $("impMsg");
  msg.style.color = "var(--out)"; msg.textContent = "";
  if (f.size > 2 * 1024 * 1024) { msg.textContent = "الملف كبير جداً (الحد 2 ميجابايت)."; return; }
  let table;
  try { table = parseCSV(await f.text()); } catch (e) { msg.textContent = "تعذّرت قراءة الملف."; return; }
  if (!table.length) { msg.textContent = "الملف فارغ."; return; }

  let idx = { date: 0, kind: 1, amount: 2, category: 3, note: 4 };
  const first = table[0].map(c => c.trim().toLowerCase());
  const hasHeader = first.includes("date") && first.includes("amount");
  if (hasHeader) {
    idx = {};
    ["date", "kind", "amount", "category", "note"].forEach(n => { idx[n] = first.indexOf(n); });
    table.shift();
  }
  if (idx.date < 0 || idx.kind < 0 || idx.amount < 0 || idx.category < 0) {
    msg.textContent = "ينقص الملف أحد الأعمدة: date, kind, amount, category."; return;
  }
  if (table.length > 2000) { msg.textContent = "عدد الصفوف كبير (الحد 2000 في المرة الواحدة)."; return; }

  const kinds = { income: "income", expense: "expense", "وارد": "income", "مصروف": "expense" };
  const counts = new Map();
  rows.forEach(r => { const k = rowKey(r); counts.set(k, (counts.get(k) || 0) + 1); });

  const good = [];
  let bad = 0, dup = 0;
  const badRows = [];
  const offset = hasHeader ? 2 : 1;
  table.forEach((r, i) => {
    const get = k => (idx[k] >= 0 && idx[k] < r.length) ? r[idx[k]].trim() : "";
    const date = get("date");
    const kind = kinds[get("kind").toLowerCase()];
    const amount = Number(get("amount"));
    const category = get("category");
    const note = get("note");
    const d = new Date(date + "T00:00:00Z");
    const okDate = /^\d{4}-\d{2}-\d{2}$/.test(date) && !isNaN(d) && d.toISOString().slice(0, 10) === date;
    if (!okDate || !kind || !isFinite(amount) || !(amount > 0) || !category || category.length > 100 || note.length > 500) {
      bad++; if (badRows.length < 5) badRows.push(i + offset); return;
    }
    const rec = { tx_date: date, kind, amount: Math.round(amount * 100) / 100, category, note: note || null, ledger_id: currentLedgerId };
    const k = rowKey(rec);
    if ((counts.get(k) || 0) > 0) { counts.set(k, counts.get(k) - 1); dup++; return; }
    good.push(rec);
  });

  const badTxt = bad ? " (الصفوف: " + badRows.join("، ") + (bad > badRows.length ? "، ..." : "") + ")" : "";
  if (!good.length) {
    msg.textContent = "لا توجد عمليات جديدة للاستيراد. مكررة: " + dup + "، غير صالحة: " + bad + badTxt;
    return;
  }
  if (!confirm("سيتم استيراد " + good.length + " عملية جديدة.\nمكررة (تُتخطّى): " + dup + "\nغير صالحة (تُتخطّى): " + bad + badTxt + "\n\nالمتابعة؟")) return;

  $("importBtn").disabled = true;
  let done = 0;
  for (let i = 0; i < good.length; i += 200) {
    const chunk = good.slice(i, i + 200);
    const { error } = await db.from("transactions").insert(chunk);
    if (error) {
      msg.textContent = "توقف الاستيراد بعد " + done + " عملية: " + error.message;
      $("importBtn").disabled = false;
      await load();
      return;
    }
    done += chunk.length;
  }
  $("importBtn").disabled = false;
  msg.style.color = "var(--in)";
  msg.textContent = "تم استيراد " + done + " عملية.";
  await load();
};
